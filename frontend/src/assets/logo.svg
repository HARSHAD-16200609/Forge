<svg width="512" height="128" viewBox="0 0 512 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ws-badge" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD68C"/>
      <stop offset="1" stop-color="#0FAB5F"/>
    </linearGradient>
    <linearGradient id="ws-text" x1="128" y1="64" x2="400" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16A566"/>
      <stop offset="1" stop-color="#0C5237"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#ws-badge)"/>

  <!-- Core sphere -->
  <circle cx="64" cy="64" r="26" fill="white"/>

  <!-- Orbit ring -->
  <ellipse cx="64" cy="64" rx="40" ry="16" fill="none" stroke="white" stroke-opacity="0.55" stroke-width="4" transform="rotate(-22 64 64)"/>

  <!-- Team nodes -->
  <circle cx="64" cy="40" r="9" fill="#0FAB5F"/>
  <circle cx="64" cy="88" r="9" fill="white" stroke="#0FAB5F" stroke-width="5"/>
  <circle cx="36" cy="64" r="7" fill="#0FAB5F"/>
  <circle cx="92" cy="64" r="7" fill="#0FAB5F"/>

  <!-- Wordmark -->
  <text x="148" y="79" font-family="'Lexend', 'Geist', system-ui, sans-serif" font-size="52" font-weight="600" letter-spacing="-1" fill="url(#ws-text)">Work</text>
  <text x="148" y="119" font-family="'Lexend', 'Geist', system-ui, sans-serif" font-size="26" font-weight="500" letter-spacing="4" fill="#16A566" opacity="0.85">SPHERE</text>
</svg>