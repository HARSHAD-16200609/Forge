<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Forge — channels and threads for teams</title>
        <meta
            name="description"
            content="Forge is a team workspace built around channels and threads. Replies stay attached to the message that started them, and unread counts and search mean you can leave for a week and still catch up."
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Forge — channels and threads for teams" />
        <meta
            property="og:description"
            content="A team workspace built around channels and threads, so a decision is never buried six scrolls down."
        />
        <meta name="twitter:card" content="summary" />
        <!-- Matches the landing canvas so the browser chrome does not sit
             against a different colour than the page. -->
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120f" />
        <script>
            (function () {
                try {
                    const stored = localStorage.getItem("theme");
                    const theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia("(prefers-color-scheme: dark)").matches
                              ? "dark"
                              : "light";
                    if (theme === "dark") document.documentElement.classList.add("dark");
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
