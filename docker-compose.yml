services:
  backend:
    image: harshad000007/forge-backend:${IMAGE_TAG}
    container_name: forge-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./certs/global-bundle.pem:/app/certs/global-bundle.pem:ro

    networks:
      - forge-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: >
      sh -c "npx prisma migrate deploy &&
             npm start"

  frontend:
    image: harshad000007/forge-frontend:${IMAGE_TAG}
    container_name: forge-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    networks:
      - forge-network

networks:
  forge-network:
    driver: bridge